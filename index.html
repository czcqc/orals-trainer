/* ---------- storage ---------- */
const KEY = 'eow-orals-v2';
let store = { marks: {}, history: [] };
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
const catLabel = q => `${CATS[q.cat]} · ${q.sub}`;
function answerHTML(q) {
  const body = q.single ? `<p class="single">${fmt(q.a[0])}</p>`
    : `<${q.num ? 'ol' : 'ul'} class="${q.num ? 'num' : ''}">${q.a.map(p => `<li>${fmt(p)}</li>`).join('')}</${q.num ? 'ol' : 'ul'}>`;
  const extra = q.x ? `<div class="extra"><h4>Also be ready to say <span>(added to your notes)</span></h4>${q.x.length > 1 ? `<ul>${q.x.map(p => `<li>${fmt(p)}</li>`).join('')}</ul>` : `<p>${fmt(q.x[0])}</p>`}</div>` : '';
  return `<div class="answer"><h3>Model answer</h3>${body}${extra}<span class="tag t-${q.t}">${esc(TAGS[q.t])}</span>${q.src ? `<p class="src">Source: ${esc(q.src)}</p>` : ''}</div>`;
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const view = document.getElementById('view');
function sectionOptions(sel, filterFn) {
  const all = Q.filter(filterFn || (() => true));
  let h = `<option value="all"${sel === 'all' ? ' selected' : ''}>All sections (${all.length} questions)</option>`;
  for (const k in SECTIONS) {
    const n = all.filter(q => q.s === k).length;
    if (n) h += `<option value="${k}"${sel === k ? ' selected' : ''}>${esc(SECTIONS[k])} (${n})</option>`;
  }
  return h;
}

/* ---------- study ---------- */
const study = { order: Q.map((_, i) => i), sec: 'all', pos: 0, shown: false };
function studyList() { return study.order.filter(i => study.sec === 'all' || Q[i].s === study.sec); }

function renderStudy() {
  const list = studyList();
  if (study.pos >= list.length) study.pos = 0;
  const q = Q[list[study.pos]];
  const know = list.filter(i => store.marks[Q[i].id] === 'know').length;
  const rev = list.filter(i => store.marks[Q[i].id] === 'review').length;
  const tot = list.length, unseen = tot - know - rev;
  const num = q.lab;
  const m = store.marks[q.id];
  view.innerHTML = `
  <div class="wrap" style="max-width:none">
    <div class="toolbar">
      <select id="sec-study" aria-label="Section">${sectionOptions(study.sec)}</select>
      <button class="btn primary" id="shuffle">↻ Shuffle</button>
      <button class="btn" id="reset">Reset progress</button>
      <span class="counter">Q ${study.pos + 1} of ${tot}</span>
    </div>
    <div class="stats">
      <div class="stat"><b>${tot}</b><span>Total</span></div>
      <div class="stat know"><b>${know}</b><span>Know it</span></div>
      <div class="stat review"><b>${rev}</b><span>Review</span></div>
      <div class="stat"><b>${unseen}</b><span>Unseen</span></div>
    </div>
    <div class="rail" aria-hidden="true"><i class="k" style="width:${tot ? know / tot * 100 : 0}%"></i><i class="r" style="width:${tot ? rev / tot * 100 : 0}%"></i></div>
    <article class="card">
      <div class="card-head">
        <div class="qbadge"><b>${num}</b><small>${q.s}</small></div>
        <div class="qtext"><div class="sec"><span class="cat c-${q.cat}">${esc(catLabel(q))}</span> ${esc(SECTIONS[q.s])}</div><h2>${esc(q.q)}</h2></div>
      </div>
      ${study.shown ? `${answerHTML(q)}` : ''}
      <div class="card-foot">
        ${study.shown ? `<button class="btn bad" id="m-review">✗ Need to review</button><button class="btn good" id="m-know">✓ Know it</button>` : ''}
        ${m ? `<span class="mark ${m}">${m === 'know' ? 'Marked: know it' : 'Marked: review'}</span>` : ''}
        <span class="spacer"></span>
        <button class="btn" id="prev">← Prev</button>
        <button class="btn primary" id="flip">${study.shown ? 'Hide answer' : 'Show answer'}</button>
        <button class="btn" id="next">Next →</button>
      </div>
    </article>
    <p class="hint"><kbd>Space</kbd> show/hide · <kbd>←</kbd> <kbd>→</kbd> move · <kbd>K</kbd> know it · <kbd>R</kbd> review</p>
  </div>`;
  const $ = id => document.getElementById(id);
  $('sec-study').onchange = e => { study.sec = e.target.value; study.pos = 0; study.shown = false; renderStudy(); renderOverview(); };
  $('shuffle').onclick = () => { study.order = shuffle(study.order); study.pos = 0; study.shown = false; renderStudy(); };
  $('reset').onclick = confirmReset;
  $('prev').onclick = () => moveStudy(-1);
  $('next').onclick = () => moveStudy(1);
  $('flip').onclick = () => { study.shown = !study.shown; renderStudy(); };
  if (study.shown) { $('m-know').onclick = () => markStudy('know'); $('m-review').onclick = () => markStudy('review'); }
}
function moveStudy(d) { const n = studyList().length; study.pos = (study.pos + d + n) % n; study.shown = false; renderStudy(); }
function markStudy(v) { const q = Q[studyList()[study.pos]]; store.marks[q.id] = v; save(); moveStudy(1); }
function confirmReset() {
  const btn = document.getElementById('reset');
  if (btn.dataset.armed) { store.marks = {}; save(); study.pos = 0; study.shown = false; renderStudy(); return; }
  btn.dataset.armed = '1'; btn.textContent = 'Click again to clear marks'; btn.classList.add('bad');
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = 'Reset progress'; btn.classList.remove('bad'); } }, 3000);
}

/* ---------- quiz ---------- */
let quiz = null; // { items, pos, picked, results }
const quizCfg = { sec: 'all', count: '10', mode: 'mcq' };

function renderQuizSetup() {
  const pool = Q.filter(q => quizCfg.sec === 'all' || q.s === quizCfg.sec);
  view.innerHTML = `
  <article class="card"><div class="setup">
    <h2>Start a quiz</h2>
    <p>Questions come up in random order. Say your answer aloud as if to the examiner, reveal the model answer, then mark yourself honestly. Your score is saved under My results.</p>
    <div class="field"><label for="q-sec">Section</label><select id="q-sec">${sectionOptions(quizCfg.sec)}</select></div>
    <div class="field"><label for="q-count">Questions</label>
      <select id="q-count">${['5','10','all'].map(v => `<option value="${v}"${quizCfg.count === v ? ' selected' : ''}>${v === 'all' ? 'All (' + pool.length + ')' : v}</option>`).join('')}</select></div>
    <div><button class="btn primary" id="q-start" ${pool.length ? '' : 'disabled'}>Start quiz →</button></div>
  </div></article>`;
  document.getElementById('q-sec').onchange = e => { quizCfg.sec = e.target.value; renderQuizSetup(); };
  document.getElementById('q-count').onchange = e => { quizCfg.count = e.target.value; };
  document.getElementById('q-start').onclick = startQuiz;
}
function startQuiz() {
  let pool = shuffle(Q.filter(q => quizCfg.sec === 'all' || q.s === quizCfg.sec));
  if (quizCfg.count !== 'all') pool = pool.slice(0, +quizCfg.count);
  quiz = { items: pool.map(q => ({ q, opts: q.opts ? shuffle(q.opts.map((t, i) => ({ t, ok: i === 0 }))) : null })), pos: 0, picked: null, shown: false, results: [] };
  renderQuiz();
}
function renderQuiz() {
  if (!quiz) return renderQuizSetup();
  if (quiz.pos >= quiz.items.length) return renderQuizEnd();
  const it = quiz.items[quiz.pos], q = it.q, n = quiz.items.length;
  const correct = quiz.results.filter(Boolean).length;
  const answered = quiz.picked !== null;
  let body = '';
  if (it.opts) {
    body = `<div class="opts">${it.opts.map((o, i) => {
      let cls = '';
      if (answered) { if (o.ok) cls = 'right'; else if (i === quiz.picked) cls = 'wrong'; }
      return `<button class="opt ${cls}" data-i="${i}" ${answered ? 'disabled' : ''}><span class="l">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`;
    }).join('')}</div>`;
    if (answered) body += `<p class="verdict ${it.opts[quiz.picked].ok ? 'ok' : 'no'}">${it.opts[quiz.picked].ok ? 'Correct.' : 'Not quite. The correct answer is highlighted.'}</p>`;
  }
  const showAns = it.opts ? answered : quiz.shown;
  if (showAns) body += `${answerHTML(q)}`;
  let foot = '';
  if (it.opts) foot = answered ? `<button class="btn primary" id="q-next">${quiz.pos + 1 === n ? 'See score' : 'Next →'}</button>` : `<span class="hint">Pick an answer</span>`;
  else foot = !quiz.shown ? `<button class="btn primary" id="q-show">Show answer</button>`
    : (answered ? `<button class="btn primary" id="q-next">${quiz.pos + 1 === n ? 'See score' : 'Next →'}</button>`
      : `<button class="btn bad" id="q-miss">✗ I missed it</button><button class="btn good" id="q-got">✓ I got it</button>`);
  view.innerHTML = `
  <div class="wrap" style="max-width:none">
    <div class="toolbar">
      <button class="btn" id="q-quit">End quiz</button>
      <span class="counter">Q ${quiz.pos + 1} of ${n} · ${correct} correct</span>
    </div>
    <div class="rail" aria-hidden="true"><i class="k" style="width:${quiz.pos / n * 100}%"></i></div>
    <article class="card">
      <div class="card-head">
        <div class="qbadge"><b>${q.lab}</b><small>${q.s}</small></div>
        <div class="qtext"><div class="sec"><span class="cat c-${q.cat}">${esc(catLabel(q))}</span> ${esc(SECTIONS[q.s])}${it.opts ? '' : ' · self-graded'}</div><h2>${esc(it.opts ? (q.mq || q.q) : q.q)}</h2></div>
      </div>
      ${body}
      <div class="card-foot"><span class="spacer"></span>${foot}</div>
    </article>
  </div>`;
  view.querySelectorAll('.opt').forEach(b => b.onclick = () => { const i = +b.dataset.i; quiz.picked = i; quiz.results.push(it.opts[i].ok); renderQuiz(); });
  const $ = id => document.getElementById(id);
  if ($('q-show')) $('q-show').onclick = () => { quiz.shown = true; renderQuiz(); };
  if ($('q-got')) $('q-got').onclick = () => { quiz.picked = 1; quiz.results.push(true); renderQuiz(); };
  if ($('q-miss')) $('q-miss').onclick = () => { quiz.picked = 0; quiz.results.push(false); renderQuiz(); };
  if ($('q-next')) $('q-next').onclick = () => { quiz.pos++; quiz.picked = null; quiz.shown = false; renderQuiz(); };
  $('q-quit').onclick = () => { quiz.items = quiz.items.slice(0, quiz.results.length); quiz.pos = quiz.items.length; renderQuiz(); };
}
function renderQuizEnd() {
  const n = quiz.results.length, c = quiz.results.filter(Boolean).length;
  if (!quiz.saved && n) {
    store.history.unshift({ d: new Date().toISOString(), sec: quizCfg.sec, n, c,
      bySec: quiz.items.reduce((m, it, i) => { const s = it.q.s; m[s] = m[s] || [0, 0]; m[s][1]++; if (quiz.results[i]) m[s][0]++; return m; }, {}) });
    store.history = store.history.slice(0, 30); save(); quiz.saved = true;
  }
  const pct = n ? Math.round(c / n * 100) : 0;
  const missed = quiz.items.filter((_, i) => !quiz.results[i]);
  view.innerHTML = `
  <article class="card"><div class="setup">
    <h2>Quiz complete</h2>
    <div class="score" style="color:var(${pct >= 70 ? '--good' : '--bad'})">${c} / ${n} <span style="font-size:1.2rem;color:var(--muted)">${pct}%</span></div>
    ${missed.length ? `<p>Go back over these in Study mode:</p><ul>${missed.map(it => `<li>${esc(it.q.q)}</li>`).join('')}</ul>` : n ? '<p>Clean sheet. Try a different section next.</p>' : '<p>No questions answered.</p>'}
    <div class="toolbar"><button class="btn primary" id="q-again">New quiz</button><button class="btn" id="q-res">See my results</button></div>
  </div></article>`;
  document.getElementById('q-again').onclick = () => { quiz = null; renderQuizSetup(); };
  document.getElementById('q-res').onclick = () => setMode('results');
}

/* ---------- results ---------- */
function renderResults() {
  const totK = Q.filter(q => store.marks[q.id] === 'know').length;
  const totR = Q.filter(q => store.marks[q.id] === 'review').length;
  const quizN = store.history.reduce((s, h) => s + h.n, 0), quizC = store.history.reduce((s, h) => s + h.c, 0);
  let rows = '';
  for (const k in SECTIONS) {
    const qs = Q.filter(q => q.s === k); if (!qs.length) continue;
    const kn = qs.filter(q => store.marks[q.id] === 'know').length, rv = qs.filter(q => store.marks[q.id] === 'review').length;
    rows += `<div class="secrow"><span>${esc(SECTIONS[k])}</span><span class="n">${kn}/${qs.length} known</span>
      <div class="rail"><i class="k" style="width:${kn / qs.length * 100}%"></i><i class="r" style="width:${rv / qs.length * 100}%"></i></div></div>`;
  }
  const hist = store.history.length ? `<div style="overflow-x:auto"><table class="hist"><thead><tr><th>Date</th><th>Section</th><th>Score</th></tr></thead><tbody>
    ${store.history.map(h => `<tr><td>${new Date(h.d).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })} ${new Date(h.d).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}</td>
      <td>${h.sec === 'all' ? 'All sections' : esc(SECTIONS[h.sec] || h.sec)}</td><td>${h.c}/${h.n} (${Math.round(h.c / h.n * 100)}%)</td></tr>`).join('')}
    </tbody></table></div>` : `<p class="empty">No quizzes taken yet. Your scores will appear here.</p>`;
  const reviewList = Q.filter(q => store.marks[q.id] === 'review');
  view.innerHTML = `
  <div class="wrap" style="max-width:none">
    <div class="stats">
      <div class="stat"><b>${Q.length}</b><span>Questions</span></div>
      <div class="stat know"><b>${totK}</b><span>Know it</span></div>
      <div class="stat review"><b>${totR}</b><span>To review</span></div>
      <div class="stat"><b>${quizN ? Math.round(quizC / quizN * 100) + '%' : '–'}</b><span>Quiz average</span></div>
    </div>
    <div class="res-grid">
      <section class="panel"><h2>Study progress by section</h2>${rows}</section>
      <section class="panel"><h2>Quiz history</h2>${hist}</section>
    </div>
    <section class="panel"><h2>Marked for review</h2>
      ${reviewList.length ? `<ul style="margin:0;padding-left:18px">${reviewList.map(q => `<li>${esc(q.q)} <span class="n" style="color:var(--muted);font-size:.8rem">(${esc(SECTIONS[q.s])})</span></li>`).join('')}</ul>
        <div style="margin-top:12px"><button class="btn primary" id="go-review">Study these now</button></div>`
        : `<p class="empty">Nothing marked yet. In Study mode, mark a card “Need to review” and it will be listed here.</p>`}
    </section>
  </div>`;
  const g = document.getElementById('go-review');
  if (g) g.onclick = () => { const ids = new Set(reviewList.map(q => q.id)); study.order = study.order.filter(i => ids.has(Q[i].id)).concat(study.order.filter(i => !ids.has(Q[i].id))); study.sec = 'all'; study.pos = 0; study.shown = false; setMode('study'); };
}

/* ---------- overview panel ---------- */
function renderOverview() {
  const el = document.getElementById('overview');
  const active = mode === 'study' ? study.sec : null;
  const secs = Object.keys(SECTIONS).map((k, i) => {
    const qs = Q.filter(q => q.s === k); if (!qs.length) return '';
    return `<button class="ov-sec${active === k ? ' on' : ''}" data-sec="${k}" title="Study this section"><span>${i + 1}. ${esc(SECTIONS[k])}</span><span class="ov-n">${qs.length}</span><span class="ov-lab">${qs[0].lab}–${qs[qs.length - 1].lab}</span></button>`;
  }).join('');
  const cats = ['E', 'R', 'G', 'W'].map(c => {
    const qs = Q.filter(q => q.cat === c), subs = {};
    qs.forEach(q => { subs[q.sub] = (subs[q.sub] || 0) + 1; });
    const list = Object.entries(subs).sort((a, b) => b[1] - a[1]).map(([s, n]) => `<li>${esc(s)} <b>${n}</b></li>`).join('');
    return `<div><div class="ov-cat-h"><span class="cat c-${c}">${CATS[c]}</span><b>${qs.length}</b> cards</div><ul class="ov-subs">${list}</ul></div>`;
  }).join('');
  const tags = ['P', 'V', 'R'].map(t => `<span class="tag t-${t}">${esc(TAGS[t])}</span><span class="n">${Q.filter(q => q.t === t).length} cards</span>`).join('');
  el.innerHTML = `<h2>How the cards are organised</h2>
    <p>${Q.length} cards. Click a section to study it. The coloured category label and the answer-type label appear on every card.</p>
    <div class="ov-grid">
      <div class="ov-block"><h3>Sections (study order)</h3><div class="ov-secs">${secs}</div></div>
      <div class="ov-block"><h3>Categories and subcategories</h3><div class="ov-cats">${cats}</div></div>
    </div>
    <div class="ov-tags"><h3 style="margin:0;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Answer types</h3>${tags}</div>`;
  el.querySelectorAll('.ov-sec').forEach(b => b.onclick = () => {
    study.sec = b.dataset.sec; study.pos = 0; study.shown = false; setMode('study');
    document.querySelector('.tabs').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

/* ---------- modes ---------- */
let mode = 'study';
function setMode(m) {
  mode = m;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.mode === m));
  if (m === 'study') renderStudy(); else if (m === 'quiz') renderQuiz(); else renderResults();
  renderOverview();
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => setMode(t.dataset.mode));
document.addEventListener('keydown', e => {
  if (mode !== 'study' || e.target.tagName === 'SELECT' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); study.shown = !study.shown; renderStudy(); }
  else if (e.key === 'ArrowRight') moveStudy(1);
  else if (e.key === 'ArrowLeft') moveStudy(-1);
  else if (study.shown && (e.key === 'k' || e.key === 'K')) markStudy('know');
  else if (study.shown && (e.key === 'r' || e.key === 'R')) markStudy('review');
});
setMode('study');
</script>
